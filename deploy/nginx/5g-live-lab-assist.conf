upstream lab_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name MEC_HOSTNAME_FROM_UNIVERSITY;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name MEC_HOSTNAME_FROM_UNIVERSITY;

    # Replace these placeholders with certificates provisioned for the university hostname.
    ssl_certificate     /etc/ssl/certs/MEC_HOSTNAME_FROM_UNIVERSITY.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/MEC_HOSTNAME_FROM_UNIVERSITY.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/5g-live-lab-assist/client/dist;
    index index.html;
    client_max_body_size 10m;

    location /socket.io/ {
        proxy_pass http://lab_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://lab_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://lab_backend/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
